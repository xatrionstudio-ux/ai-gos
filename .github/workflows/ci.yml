name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check (Python & Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: '0.5.0'

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Type check with MyPy
        run: uv run mypy .

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Install Frontend dependencies
        run: pnpm --filter web install

      - name: Lint Frontend
        run: pnpm --filter web lint

      - name: Type check Frontend
        run: pnpm --filter web type-check

  gitleaks-secret-scan:
    name: Secret Leak Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API Docker Image
        run: docker build -f infrastructure/docker/Dockerfile.api -t ai-gos/api:test .

      - name: Build Worker Docker Image
        run: docker build -f infrastructure/docker/Dockerfile.worker -t ai-gos/worker:test .

      - name: Build Web Docker Image
        run: docker build -f infrastructure/docker/Dockerfile.web -t ai-gos/web:test .
