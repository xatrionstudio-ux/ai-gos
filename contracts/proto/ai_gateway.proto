syntax = "proto3";

package agos.ai.v1;

option go_package = "github.com/xatrionstudio-ux/ai-gos/sdks/go/aigatesv1";

message CompletionRequest {
  string model = 1;
  repeated Message messages = 2;
  float temperature = 3;
  int32 max_tokens = 4;
}

message Message {
  string role = 1;
  string content = 2;
}

message CompletionResponse {
  string content = 1;
  string model = 2;
  int32 prompt_tokens = 3;
  int32 completion_tokens = 4;
  double cost_usd = 5;
}

service AIGatewayService {
  rpc Complete(CompletionRequest) returns (CompletionResponse);
}
